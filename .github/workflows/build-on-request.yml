name: Build on request
on: [workflow_dispatch, push]

jobs:
  Windows:
    name: Build windows version
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Setup MSBuild and add to PATH
      uses: microsoft/setup-msbuild@v1.0.2
      id: setup_msbuild

    - name: Clone and bootstrap vcpkg
      shell: pwsh
      run: |
        $vcpkgDir = "${{ runner.workspace }}/vcpkg"
        if (-not (Test-Path "$vcpkgDir/.git")) {
          git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
        }
        Push-Location $vcpkgDir
        git pull origin master
        Pop-Location
        & "$vcpkgDir/bootstrap-vcpkg.bat"

    - name: Provide 7zip for vcpkg (7-zip.org 404 workaround)
      shell: pwsh
      run: |
        $toolDir = "${{ runner.workspace }}/vcpkg/downloads/tools/7zip-21.07-windows"
        New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
        Copy-Item "C:\Program Files\7-Zip\7z.exe" -Destination "$toolDir\7za.exe" -Force

    - name: Pin vcpkg triplet to v142 toolset (match project toolset)
      shell: pwsh
      run: |
        $tripletFile = "${{ runner.workspace }}/vcpkg/triplets/community/x86-windows-static.cmake"
        if (-not (Test-Path $tripletFile)) {
          $tripletFile = "${{ runner.workspace }}/vcpkg/triplets/x86-windows-static.cmake"
        }
        Write-Host "Using triplet file: $tripletFile"
        Add-Content -Path $tripletFile -Value "`nset(VCPKG_PLATFORM_TOOLSET v142)"
        Get-Content $tripletFile

    - name: Run vcpkg install
      shell: pwsh
      run: |
        & "${{ runner.workspace }}/vcpkg/vcpkg" install boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl --triplet x86-windows-static --recurse

    - name: Integrate vcpkg
      shell: pwsh
      run: |
        & "${{ runner.workspace }}/vcpkg/vcpkg" integrate install
        Write-Host "=== Full lib folder listing ==="
        Get-ChildItem -Path "${{ runner.workspace }}/vcpkg/installed/x86-windows-static/lib" | Format-Table Name
        Write-Host "=== zlib package file manifest (vcpkg info) ==="
        Get-ChildItem -Path "${{ runner.workspace }}/vcpkg/installed/vcpkg/info" -Filter "zlib_*" | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName }
        Write-Host "=== vcpkg list zlib ==="
        & "${{ runner.workspace }}/vcpkg/vcpkg" list zlib
        Write-Host "=== zlib.lib fallback repair ==="
        $libDir = "${{ runner.workspace }}/vcpkg/installed/x86-windows-static/lib"
        $zlibLib = Join-Path $libDir "zlib.lib"
        if (-not (Test-Path $zlibLib)) {
          $names = @("zlibstatic.lib", "zlibstat.lib", "zdll.lib", "z.lib", "libz.lib", "libzlib.lib")
          $candidate = $null
          foreach ($n in $names) {
            $p = Join-Path $libDir $n
            if (Test-Path $p) { $candidate = $p; break }
          }
          if (-not $candidate) {
            $match = Get-ChildItem -Path $libDir -Filter "*.lib" | Where-Object { $_.Name -match "^z" -or $_.Name -match "zlib" } | Select-Object -First 1
            if ($match) { $candidate = $match.FullName }
          }
          if ($candidate) {
            Write-Host "zlib.lib missing, copying candidate: $candidate"
            Copy-Item $candidate -Destination $zlibLib -Force
          } else {
            Write-Host "No zlib-like candidate found in lib folder."
          }
        } else {
          Write-Host "zlib.lib already present."
        }

    - name: Compile otclient_dx
      timeout-minutes: 20
      run: |
        cd vc16
        MSBuild /property:Configuration=DirectX /p:BUILD_REVISION=${{github.run_number}}

    - name: Compile otclient_gl
      timeout-minutes: 20
      run: |
        cd vc16
        MSBuild /property:Configuration=OpenGL /p:BUILD_REVISION=${{github.run_number}}

    #- name: Sign binaries
    #  run: |
    #     .\tools\sign\signtool.exe sign /f .\tools\sign\certificate.pfx /p ${{ secrets.SIGN_PASSWORD }} /fd SHA256 /t http://timestamp.digicert.com /d "OTclientV8" otclient_gl.exe
    #     .\tools\sign\signtool.exe sign /f .\tools\sign\certificate.pfx /p ${{ secrets.SIGN_PASSWORD }} /fd SHA256 /t http://timestamp.digicert.com /d "OTclientV8" otclient_dx.exe

    - name: Upload binaries
      uses: 'actions/upload-artifact@v4'
      with:
        name: Download-binaries
        path: |
          otclient_gl.exe
          otclient_dx.exe
        if-no-files-found: error

  Mac:
    name: Build mac os version
    runs-on: macos-11
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Get latest CMake
      uses: lukka/get-cmake@latest

    - name: MacOS - install physfs pkgconfig luajit xquartz
      run: brew install physfs pkgconfig luajit xquartz

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v7
      with:
        vcpkgArguments: >
          boost-iostreams boost-asio boost-system boost-variant boost-lockfree boost-beast glew
          boost-filesystem boost-uuid libogg libvorbis zlib opengl libzip openal-soft bzip2
          boost-process openssl
        vcpkgDirectory: ${{ runner.workspace }}/vcpkg/
        vcpkgTriplet: x64-osx
        vcpkgGitCommitId: 761c81d43335a5d5ccc2ec8ad90bd7e2cbba734e

    - name: Build with CMake
      uses: lukka/run-cmake@v3
      with:
        buildDirectory: ${{ runner.workspace }}/build
        cmakeAppendedArgs: '-G Ninja -DCMAKE_BUILD_TYPE="Release" -DVERSION=${{github.run_number}}'
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        useVcpkgToolchainFile: true

    - name: Change name
      run: |
        mv '${{ runner.workspace }}/build/otclient' '${{ runner.workspace }}/build/otclient_mac'

    - name: Upload otclient
      uses: actions/upload-artifact@v4
      with:
        name: Download-binaries
        path: |
          ${{ runner.workspace }}/build/otclient_mac
        if-no-files-found: error

  Linux:
    name: Build linux version
    runs-on: ubuntu-20.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Get latest CMake
      uses: lukka/get-cmake@latest

    - name: Ubuntu - install opengl lua5.1 luajit
      run: sudo apt update && sudo apt install -y libglew-dev liblua5.1-0-dev libluajit-5.1-dev

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v7
      with:
        vcpkgArguments: >
          boost-iostreams boost-asio boost-system boost-variant boost-lockfree boost-beast glew
          boost-filesystem boost-uuid libogg libvorbis zlib opengl libzip openal-soft bzip2
          boost-process openssl physfs
        vcpkgDirectory: ${{ runner.workspace }}/vcpkg/
        vcpkgTriplet: x64-linux
        vcpkgGitCommitId: 761c81d43335a5d5ccc2ec8ad90bd7e2cbba734e

    - name: Build with CMake
      uses: lukka/run-cmake@v3
      with:
        buildDirectory: ${{ runner.workspace }}/build
        cmakeAppendedArgs: '-G Ninja -DCMAKE_BUILD_TYPE="Release" -DVERSION=${{github.run_number}}'
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        useVcpkgToolchainFile: true

    - name: Change name
      run: |
        mv '${{ runner.workspace }}/build/otclient' '${{ runner.workspace }}/build/otclient_linux'

    - name: Upload otclient
      uses: actions/upload-artifact@v4
      with:
        name: Download-binaries
        path: |
          ${{ runner.workspace }}/build/otclient_linux
        if-no-files-found: error
